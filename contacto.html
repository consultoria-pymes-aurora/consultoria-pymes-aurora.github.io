<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>

    body {
      background-color: #f7f7f7;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* HEADER */
    header {
      background: #ffffff;
      text-align: center;
      padding: 25px 0 10px 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
    }

    header h1 {
      margin: 8px 0 0;
      font-size: 2rem;
    }

    /* MENÚ */
    nav {
      margin: 15px 0;
    }

    nav a {
      display: inline-block;
      padding: 8px 14px;
      margin: 0 6px;
      background: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      border: 1px solid #ddd;
      transition: background 0.3s ease, transform 0.2s ease;
      font-size: 1rem;
    }

    nav a:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
    }

    /* CONTACTO */
    .contact-card {
      max-width: 700px;
      margin: 60px auto;
      padding: 30px 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    .contact-card h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .contact-card p {
      font-size: 1.3rem;
      line-height: 1.6;
      margin: 12px 0;
    }

    /* CELULAR */
    @media (max-width: 600px) {
      body { font-size: 1.3rem; }
      header img { width: 60px; height: 60px; }
      header h1 { font-size: 2rem; }
      nav a { padding: 10px 12px; font-size: 1.2rem; margin: 4px; }
      .contact-card h2 { font-size: 2.1rem; }
      .contact-card p { font-size: 1.4rem; }
    }

  </style>
</head>
<body>

<header>
  <img src="favicon.svg" alt="Logo Videos Bakanes">
  <h1>VIDEOS BAKANES</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="mascotas.html">Dueños de Mascotas</a>
  <a href="pymes.html">Dueños de PyMEs</a>
  <a href="contacto.html">Contacto</a>
  <a href="privacidad.html">Privacidad</a>
</nav>

<div class="contact-card">
  <h2>Contacto</h2>
  <p>Hola, soy Alejandro.</p>
  <p>Vivo en Ñuñoa (Santiago).</p>
  <p>Si quieres contactarme, puedes escribirme al:</p>
  <p><b>consultoria.pymes.aurora@gmail.com</b></p>
</div>

</body>
</html>
