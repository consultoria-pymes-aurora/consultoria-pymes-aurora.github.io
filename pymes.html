<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dueños de PyMEs</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>

    body {
      background-color: #f7f7f7;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* HEADER */
    header {
      background: #ffffff;
      padding: 25px 0 10px 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
    }

    header h1 {
      margin: 8px 0 0;
      font-size: 2rem;
    }

    /* MENÚ */
    nav {
      margin: 15px 0;
    }

    nav a {
      display: inline-block;
      padding: 8px 14px;
      margin: 0 6px;
      background: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      border: 1px solid #ddd;
      transition: background 0.3s ease, transform 0.2s ease;
      font-size: 1rem;
    }

    nav a:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
    }

    /* CONTENIDO */
    h2 {
      margin-top: 50px;
      font-size: 2rem;
    }

    p {
      font-size: 1.3rem;
      line-height: 1.6;
      margin: 20px;
    }

    /* IMAGEN */
    .zoom-img {
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .zoom-img:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }

    /* CTA */
    .contacto-section {
      margin: 50px 0 70px;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .contacto-section a {
      color: #d32f2f;
      text-decoration: none;
    }

    /* CELULAR */
    @media (max-width: 600px) {
      body { font-size: 1.3rem; }
      header img { width: 60px; height: 60px; }
      header h1 { font-size: 2rem; }
      nav a { padding: 10px 12px; font-size: 1.2rem; margin: 4px; }
      h2 { font-size: 1.9rem; }
      p { font-size: 1.4rem; }
      .zoom-img { max-width: 100%; }
      .contacto-section { font-size: 1.8rem; }
    }

  </style>
</head>
<body>

<header>
  <img src="favicon.svg" alt="Logo Videos Bakanes">
  <h1>VIDEOS BAKANES</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="pymes.html">Dueños de PyMEs</a>
  <a href="mascotas.html">Dueños de Mascotas</a>
  <a href="contacto.html">Contacto</a>
  <a href="privacidad.html">Privacidad</a>
</nav>

<h2>Videos profesionales para tu negocio</h2>

<p>
  ¿Quieres mostrar tus productos o servicios de forma clara y profesional?<br>
  Si te interesa conversar, puedes ir a la página de contacto.
</p>

<a href="contacto.html">
  <img src="pyme.jpg" class="zoom-img" alt="Video para PyMEs">
</a>

<div class="contacto-section">
  <a href="contacto.html">Ir a la página de Contacto</a>
</div>

</body>
</html>
