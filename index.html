  <style>

    body {
      background-color: #f7f7f7;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* HEADER */
    header {
      background: #ffffff;
      padding: 25px 0 10px 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
    }

    header h1 {
      margin: 8px 0 0 0;
      font-size: 2rem;
    }

    /* MENÚ */
    nav {
      margin: 15px 0;
    }

    nav a {
      display: inline-block;
      padding: 8px 14px;
      margin: 0 6px;
      background: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      border: 1px solid #ddd;
      transition: background 0.3s ease, transform 0.2s ease;
      font-size: 1rem;
    }

    nav a:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
    }

    h2 {
      margin-top: 40px;
      font-size: 2rem;
    }

    p {
      font-size: 1.3rem;
      line-height: 1.6;
      margin: 20px;
    }

    /* IMÁGENES */
    .zoom-img {
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .zoom-img:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }

    .center {
      margin: 20px 0;
    }

    hr {
      margin: 60px auto;
      width: 60%;
      border: none;
      border-top: 1px solid #ccc;
    }

    .contacto-section,
    .privacidad-section {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 30px 0;
    }

    .contacto-section a,
    .privacidad-section a {
      color: #d32f2f;
      text-decoration: none;
    }

    /* CELULAR */
    @media (max-width: 600px) {

      body { font-size: 1.3rem; }

      header img { width: 60px; height: 60px; }

      header h1 { font-size: 2rem; }

      h2 { font-size: 1.9rem; }
      p { font-size: 1.4rem; }

      nav a {
        padding: 10px 12px;
        font-size: 1.2rem;
        margin: 4px;
      }

      .zoom-img {
        width: 100%;
        max-width: 100%;
      }

      .contacto-section,
      .privacidad-section {
        font-size: 1.8rem;
      }
    }

  </style>
